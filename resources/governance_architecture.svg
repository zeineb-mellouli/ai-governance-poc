<text x="320.0" y="574.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6b7684">medallion layers · pandera checks · env-var secrets</text>
<text x="320" y="620" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#1f6f4a">Compliant by construction — not by correction</text>
<rect x="960.0" y="344" width="400" height="54" rx="6" fill="#b3261e12" stroke="#b3261e" stroke-width="1.5"/>
<text x="1160.0" y="365.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#b3261e">Repository Agent</text>
<text x="1160.0" y="383.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6b7684">walks the repo · no model call</text>
<path d="M1160,398 L1160,424" stroke="#b3261e" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
