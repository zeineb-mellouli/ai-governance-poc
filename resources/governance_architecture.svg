<text x="740.0" y="64" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6b7684">One policy library, enforced twice: before the code exists, and after it lands</text>
