<text x="1160" y="300" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#b3261e">RUN TIME  ·  DETECT</text>
