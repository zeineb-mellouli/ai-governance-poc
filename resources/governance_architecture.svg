<text x="320.0" y="370.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#1f6f4a">GitHub Spec Kit</text>
<text x="320.0" y="388.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6b7684">spec.md · plan.md · tasks.md · data-model.md</text>
