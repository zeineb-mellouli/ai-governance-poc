<text x="1160.0" y="482.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6b7684">deterministic in code: repo name, file names, pinning</text>
