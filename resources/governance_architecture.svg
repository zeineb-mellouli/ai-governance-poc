<text x="1160.0" y="581.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6b7684">writes a fix, or hands it to a person</text>
