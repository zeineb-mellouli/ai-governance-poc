# Ground truth for sample_repos/holistic/fin-code-fx_exposure_report
#
# The holistic repo: no single file is obviously broken, but the repository as
# a whole has NO data quality validation anywhere, and its README maps
# `staging/` to the Silver layer, so the silver quality gate (ARCH-12 rule 4)
# is missing across the whole pipeline. 

repo: fin-code-fx_exposure_report

expect_violations:
  - {policy: DQ-1, file: Treasury_Pipeline/01_IngestFXPositions.py, note: bronze -> staging with no validation of any kind}
  - {policy: ARCH-12, file: Treasury_Pipeline/01_IngestFXPositions.py, note: writes the silver-equivalent staging layer with no quality gate}
  - {policy: NAM-5, file: bronze/FXPositions_20240630.csv, note: 8-digit date suffix}
  - {policy: NAM-5, file: staging/FXPositionsProcessed_20240630.csv, note: 8-digit date suffix}

expect_clean:
  - {policy: NAM-5, file: gold/QuarterlyFXExposureReport.csv, note: no date suffix is fine; suffix is optional}
  - {policy: NAM-5, file: Treasury_Pipeline/01_IngestFXPositions.py, note: 01_ stage prefix}
  - {policy: NAM-5, file: Treasury_Pipeline/02_GenerateExposureReport.py, note: 02_ stage prefix}
  - {policy: ARCH-12, file: Treasury_Pipeline/02_GenerateExposureReport.py, note: staging(silver) -> gold with aggregation}
  - {policy: SQL-10, file: Treasury_SQL/CreateFXExposureFact.sql, note: Reporting.FXExposureFact correct}
  - {policy: SQL-11, file: Treasury_SQL/CreateFXExposureFact.sql, note: PascalCase, QuarterEndDate qualified}
  - {policy: GIT-8, file: azure-pipelines.yml, note: master + develop only}
  - {policy: REPRO-13, file: requirements.txt, note: all three packages pinned}
  - {policy: REPRO-6, file: Treasury_Pipeline/02_GenerateExposureReport.py, note: no stochastic operations}
  - {policy: OPS-2, file: Treasury_Pipeline/01_IngestFXPositions.py, note: logging configured to logs/ingest.log}
  - {policy: OPS-2, file: Treasury_Pipeline/02_GenerateExposureReport.py, note: logging configured to logs/report.log}
  - {policy: SEC-3, file: Treasury_Pipeline/01_IngestFXPositions.py, note: no credentials}
  - {policy: PII-4, file: bronze/FXPositions_20240630.csv, note: position id and notional, no direct identifiers}
  - {policy: DM-7, file: null, note: grain stated in Treasury_SQL/CreateFXExposureFact.sql}

tolerate:
  - {policy: DQ-1, file: Treasury_Pipeline/02_GenerateExposureReport.py, note: same missing gate, already charged to 01}
